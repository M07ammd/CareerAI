services:
  # ==========================================================================
  # Backend – FastAPI + LangGraph
  # ==========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: careerpilot-backend
    env_file:
      - .env
    volumes:
      - careerpilot_data:/app/data     # Persist generated reports in named volume
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # ==========================================================================
  # Frontend – React + Vite (production build served by Nginx)
  # ==========================================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: careerpilot-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  careerpilot_data:
    name: careerpilot_data
